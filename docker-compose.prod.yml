services:
  backend:
    image: ${ECR_REGISTRY}/marketverse-backend:${IMAGE_TAG}
    container_name: mern-marketverse-backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - marketverse-net

  frontend:
    image: ${ECR_REGISTRY}/marketverse-frontend:${IMAGE_TAG}
    container_name: mern-marketverse-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - marketverse-net
  
  

  redis:
    image: redis:7-alpine
    container_name: marketverse-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - marketverse-net


networks:
  marketverse-net:
    driver: bridge

volumes:
  redis-data: