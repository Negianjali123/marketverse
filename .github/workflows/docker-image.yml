name: Docker Image CI
permissions:
  id-token: write
  contents: read
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-push:
    runs-on: ubuntu-latest
    
    steps:

      # build Docker images
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2  

        # this must be automatically produced  ${{ steps.login-ecr.outputs.registry }} by this GitHub Actions step
      - name: Build backend
        run: |
          docker build \
           -t ${{ steps.login-ecr.outputs.registry }}/marketverse-backend:${{ github.sha }} \
          ./backend 

      - name: Build frontend
        run: |
          docker build \
          -t ${{ steps.login-ecr.outputs.registry }}/marketverse-frontend:${{ github.sha }} \
           ./frontend 
     
      # push to ECR
      - name: Push backend
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/marketverse-backend:${{ github.sha }}
      
      - name: Push frontend
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/marketverse-frontend:${{ github.sha }}
            
  test-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    
      # tell EC2 to pull images
      - name: Configure AWS credentials Check
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}  #new police for ODIC 
          aws-region: ${{ secrets.AWS_REGION }} 
          
      - name: Check SSM instance
        run: |
          aws ssm describe-instance-information \
          --region ap-south-1 \
          --filters "Key=InstanceIds,Values=i-02ec7b48b88c77487"

      # restart containers
      # command-executed :AWS CLI, keep checking this SSM command until it reaches a terminal state.
      # command-invocation : What is the current status/output of this particular command
      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/marketverse",
              "export ECR_REGISTRY=${{ secrets.ECR_REGISTRYT }}",
              "export IMAGE_TAG=${{ github.sha }}",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d"
            ]' \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for SSM command to finish..."
          
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ secrets.AWS_REGION }}"
          
          echo "Getting final SSM result..."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ secrets.AWS_REGION }}"
          
           echo "----- STANDARD OUTPUT -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "StandardOutputContent" \
            --output text

          echo "----- STANDARD ERROR -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "StandardErrorContent" \
            --output text

          